<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repo Risk Signals Settings</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 640px; margin: 20px auto; padding: 0 12px; }
      label { font-weight: bold; display: block; margin: 12px 0 6px; }
      input { width: 100%; padding: 8px; box-sizing: border-box; }
      button { margin-top: 12px; padding: 8px 12px; }
      #status { margin-top: 10px; color: #2f6f44; }
      small { color: #666; display:block; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Repo Risk Signals – Settings</h1>
    <p>Add an optional GitHub Personal Access Token to increase API rate limits.</p>
    <label for="github-token">GitHub token</label>
    <input id="github-token" type="password" placeholder="ghp_... or github_pat_..." />
    <button id="save">Save token</button>
    <button id="clear" type="button">Clear token</button>
    <div id="status"></div>
    <small>Token is stored in extension local storage on your browser profile.</small>
    <script src="options.js" type="module"></script>
  </body>
</html>
